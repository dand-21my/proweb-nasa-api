<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagens da Astronomia</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa-claro: #ffe4f1;
    --rosa: #f9a8d4;
    --rosa-forte: #ec4899;
    --rosa-escuro: #be185d;
    --vinho: #831843;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--vinho);
    text-align: center;
    background: linear-gradient(160deg, #ffe4f1 0%, #fbcfe8 45%, #f9a8d4 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* estrelinhas de fundo */
  .estrela {
    position: fixed;
    pointer-events: none;
    color: #fff;
    animation: brilhar 3s ease-in-out infinite;
    text-shadow: 0 0 8px var(--rosa-forte);
    z-index: 0;
  }
  @keyframes brilhar {
    0%, 100% { opacity: .2; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  main { position: relative; z-index: 1; padding: 28px 16px 48px; }

  h1 {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.2rem);
    margin: 0;
    color: var(--rosa-escuro);
    text-shadow: 3px 3px 0 #fff;
  }
  .sub { margin: 6px 0 22px; font-weight: 600; color: var(--rosa-escuro); }

  /* vitrine de fotos passando */
  .vitrine {
    overflow: hidden;
    margin: 0 -16px 26px;
    padding: 10px 0;
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .faixa {
    display: flex;
    gap: 14px;
    width: max-content;
    animation: correr 45s linear infinite;
  }
  .vitrine:hover .faixa { animation-play-state: paused; }
  @keyframes correr {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .foto-card, .placeholder {
    width: 230px;
    height: 160px;
    flex-shrink: 0;
    border-radius: 20px;
    border: 4px solid #fff;
    box-shadow: 0 6px 16px rgba(190, 24, 93, .25);
    object-fit: cover;
    transition: transform .25s;
  }
  .foto-card:hover { transform: scale(1.06) rotate(-1.5deg); }
  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    background: linear-gradient(135deg, #fbcfe8, #f472b6);
  }

  /* cartão do formulário */
  .card {
    max-width: 640px;
    margin: 0 auto 22px;
    padding: 22px;
    background: rgba(255, 255, 255, .55);
    backdrop-filter: blur(8px);
    border: 2px solid #fff;
    border-radius: 28px;
    box-shadow: 0 10px 30px rgba(190, 24, 93, .18);
  }
  form { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  input, select, button {
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 16px;
    border-radius: 999px;
    border: 2px solid var(--rosa);
    background: #fff;
    color: var(--vinho);
    outline: none;
  }
  input { flex: 1 1 240px; }
  input:focus, select:focus { border-color: var(--rosa-forte); box-shadow: 0 0 0 4px rgba(236, 72, 153, .2); }
  input::placeholder { color: #d78bb0; }
  button {
    cursor: pointer;
    font-weight: 700;
    color: #fff;
    border: none;
    background: linear-gradient(135deg, #f472b6, #db2777);
    box-shadow: 0 5px 14px rgba(219, 39, 119, .4);
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(219, 39, 119, .5); }
  button:disabled { opacity: .6; cursor: wait; transform: none; }

  #status { min-height: 1.6em; margin: 14px 0 0; font-weight: 600; color: var(--rosa-escuro); }

  /* carrossel de resultados */
  #carousel { display: none; max-width: 820px; margin: 0 auto; position: relative; }
  .moldura {
    position: relative;
    padding: 10px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 12px 34px rgba(190, 24, 93, .3);
  }
  #foto {
    display: block;
    width: 100%;
    max-height: 68vh;
    object-fit: contain;
    border-radius: 20px;
    background: #fdf2f8;
  }
  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    padding: 0;
    font-size: 1.6rem;
    line-height: 1;
    background: rgba(236, 72, 153, .85);
  }
  .nav:hover { transform: translateY(-50%) scale(1.1); }
  #prev { left: -14px; }
  #next { right: -14px; }
  #caption { margin-top: 14px; }
  #caption h2 { margin: 0 0 4px; font-size: 1.3rem; color: var(--rosa-escuro); }
  #caption small { font-weight: 600; }
  #caption a { color: var(--rosa-forte); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>imagens da astronomia</h1>

  <!-- fotos passando -->
  <div class="vitrine"><div class="faixa" id="faixa"></div></div>

  <div class="card">
    <form id="form">
      <input id="termo" placeholder="Digite um astro em inglês (Mars, Moon, Saturn...)" required>
      <select id="meses">
        <option value="12" selected>Último ano</option>
        <option value="36">Últimos 3 anos</option>
        <option value="60">Últimos 5 anos</option>
      </select>
      <button id="buscar">Buscar</button>
    </form>
    <p id="status"></p>
  </div>

  <div id="carousel">
    <div class="moldura">
      <img id="foto" alt="">
      <button class="nav" id="prev">‹</button>
      <button class="nav" id="next">›</button>
    </div>
    <div id="caption">
      <h2 id="titulo"></h2>
      <small id="info"></small> •
      <a id="hd" href="#" target="_blank" rel="noopener">ver em HD</a>
    </div>
  </div>
</main>

<!-- a chave (API_KEY) vem do config.js; precisa carregar ANTES do script principal -->
<script src="config.js"></script>
<script>
  const BASE_URL = 'https://api.nasa.gov/planetary/apod';

  const $ = id => document.getElementById(id);
  const cache = {};
  let resultados = [];
  let indice = 0;

  const fmt = d => d.toISOString().slice(0, 10);
  const esperar = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- estrelinhas de fundo ---------- */
  (function criarEstrelas() {
    const simbolos = ['✦', '✧', '⋆', '✦', '✧'];
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.className = 'estrela';
      s.textContent = simbolos[i % simbolos.length];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.fontSize = 10 + Math.random() * 18 + 'px';
      s.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(s);
    }
  })();

  /* ---------- vitrine de fotos na tela inicial ---------- */
  function montarVitrine(urls) {
    let html;
    if (urls.length >= 4) {
      html = urls.map(u => `<img class="foto-card" src="${u}" alt="Foto do universo" onerror="this.remove()">`).join('');
    } else {
      // enquanto carrega (ou se tudo falhar): cartões rosa lisos
      html = Array.from({ length: 8 }, () => '<div class="placeholder"></div>').join('');
    }
    $('faixa').innerHTML = html + html; // duplica para o loop ficar contínuo
  }

  // fetch com tempo limite; devolve null se falhar
  async function pegarJSON(url, ms = 10000) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url, { signal: c.signal });
      if (!r.ok) return null;
      return await r.json();
    } catch (e) {
      return null;
    } finally {
      clearTimeout(t);
    }
  }

  async function carregarVitrine() {
    montarVitrine([]);

    // 1) tenta o APOD (até 2 vezes)
    for (let i = 0; i < 2; i++) {
      const dados = await pegarJSON(`${BASE_URL}?api_key=${API_KEY}&count=20`);
      if (dados) {
        const urls = dados
          .filter(d => d.media_type === 'image' && !d.copyright)
          .slice(0, 10)
          .map(d => d.url);
        if (urls.length >= 4) return montarVitrine(urls);
      }
      await esperar(800);
    }

    // 2) plano B: biblioteca de imagens da NASA (não precisa de chave)
    const lib = await pegarJSON('https://images-api.nasa.gov/search?q=galaxy%20nebula&media_type=image');
    const urls = ((lib && lib.collection && lib.collection.items) || [])
      .map(it => it.links && it.links[0] && it.links[0].href)
      .filter(Boolean)
      .slice(0, 12);
    if (urls.length >= 4) montarVitrine(urls);
  }
  carregarVitrine();

  /* ---------- busca por período ---------- */
  function gerarPeriodos(qtdMeses) {
    const periodos = [];
    const ontem = fmt(new Date(Date.now() - 86400000));
    const hoje = new Date();
    let ano = hoje.getFullYear();
    let mes = hoje.getMonth();

    for (let i = 0; i < qtdMeses; i++) {
      const ini = fmt(new Date(Date.UTC(ano, mes, 1)));
      let fim = fmt(new Date(Date.UTC(ano, mes + 1, 0)));
      if (fim > ontem) fim = ontem;
      if (ini <= ontem) periodos.push([ini, fim]);
      mes--;
      if (mes < 0) { mes = 11; ano--; }
    }
    return periodos;
  }

  async function buscarPeriodo(inicio, fim) {
    const chave = `${inicio}_${fim}`;
    if (cache[chave]) return cache[chave];
    const url = `${BASE_URL}?api_key=${API_KEY}&start_date=${inicio}&end_date=${fim}`;

    for (let tentativa = 1; tentativa <= 2; tentativa++) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);
      try {
        const resp = await fetch(url, { signal: controller.signal });
        if (resp.status === 429) throw new Error('FATAL:Limite de requisições atingido. Espere um pouco ou use sua própria chave.');
        if (resp.status === 403) throw new Error('FATAL:Chave de API inválida.');
        if (resp.ok) {
          cache[chave] = await resp.json();
          return cache[chave];
        }
      } catch (err) {
        if (err.message.startsWith('FATAL:')) throw new Error(err.message.slice(6));
      } finally {
        clearTimeout(timer);
      }
      await esperar(1000);
    }
    return null;
  }

  function filtrar(lista, termo) {
    const t = termo.toLowerCase();
    const achados = lista.filter(item =>
      item.media_type === 'image' &&
      !item.copyright &&
      item.title.trim().toLowerCase() !== 'nasa science' && // entradas só com a logo
      (item.title + ' ' + item.explanation).toLowerCase().includes(t)
    );
    const ehFotoApod = i => ((i.url || '').includes('/apod/image/') ? 0 : 1);
    const noTitulo = i => (i.title.toLowerCase().includes(t) ? 0 : 1);
    // 1º fotos reais do APOD, 2º astro no título, 3º mais recentes
    return achados.sort((a, b) =>
      ehFotoApod(a) - ehFotoApod(b) ||
      noTitulo(a) - noTitulo(b) ||
      b.date.localeCompare(a.date)
    );
  }

  /* ---------- carrossel ---------- */
  let falhasImg = 0;
  $('foto').onload = () => { falhasImg = 0; };
  $('foto').onerror = () => {
    // se esta imagem não carregar, pula para a próxima (sem entrar em loop infinito)
    if (++falhasImg < resultados.length) mover(1);
  };

  function mostrar() {
    const item = resultados[indice];
    $('foto').src = item.url;
    $('foto').alt = item.title;
    $('titulo').textContent = item.title;
    $('info').textContent = `${item.date} • ${indice + 1} de ${resultados.length}`;
    $('hd').href = item.hdurl || item.url;
  }

  function mover(passo) {
    indice = (indice + passo + resultados.length) % resultados.length;
    mostrar();
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const termo = $('termo').value.trim();
    const periodos = gerarPeriodos(Number($('meses').value));

    $('buscar').disabled = true;
    $('carousel').style.display = 'none';

    try {
      let todos = [];
      let feitos = 0;

      // baixa uma lista de meses com N downloads simultâneos; devolve os que falharam
      async function rodar(lista, n) {
        const fila = [...lista];
        const erros = [];
        async function trabalhador() {
          try {
            while (fila.length) {
              const periodo = fila.shift();
              const dados = await buscarPeriodo(periodo[0], periodo[1]);
              if (dados) { todos = todos.concat(dados); feitos++; }
              else erros.push(periodo);
              $('status').textContent = `Baixando... (${feitos} de ${periodos.length} meses)`;
            }
          } catch (err) {
            fila.length = 0; // erro grave (chave/limite): para todo mundo
            throw err;
          }
        }
        await Promise.all(Array.from({ length: n }, () => trabalhador()));
        return erros;
      }

      let erros = await rodar(periodos, 3);
      if (erros.length) {
        $('status').textContent = `A NASA está lenta, tentando de novo ${erros.length} mês(es)...`;
        erros = await rodar(erros, 2);
      }
      const falhas = erros.length;
      todos.sort((a, b) => b.date.localeCompare(a.date)); // mais recentes primeiro

      resultados = filtrar(todos, termo);
      const aviso = falhas > 0 ? ` (${falhas} mês(es) falharam na NASA e foram pulados)` : '';

      if (resultados.length === 0) {
        $('status').textContent = `Nenhuma imagem sem copyright encontrada para "${termo}".${aviso} Tente outro termo ou mais tempo.`;
      } else {
        indice = 0;
        $('status').textContent = `${resultados.length} imagem(ns) encontrada(s)!${aviso}`;
        $('carousel').style.display = 'block';
        mostrar();
      }
    } catch (err) {
      $('status').textContent = err.message;
    } finally {
      $('buscar').disabled = false;
    }
  });

  $('prev').addEventListener('click', () => mover(-1));
  $('next').addEventListener('click', () => mover(1));
  document.addEventListener('keydown', e => {
    if (resultados.length === 0) return;
    if (e.key === 'ArrowLeft') mover(-1);
    if (e.key === 'ArrowRight') mover(1);
  });
</script>
</body>
</html>
